name: P0 baseline verification - revision work
on:
  push:
    branches: [revision-work]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout revision-work only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify frozen baseline (read only)
        run: |
          python revision_work/phase_00_baseline/verify_checkout.py --repo . --output "$RUNNER_TEMP/p0_verification"

      - name: Upload P0 integrity and row-count evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-integrity-evidence
          path: ${{ runner.temp }}/p0_verification/
          retention-days: 30
          if-no-files-found: warn

      - name: Install only existing test dependencies
        run: python -m pip install numpy pandas scikit-learn openpyxl

      - name: Run existing research audit tests
        run: python -m unittest discover -s revision_work/tests -p 'test_*.py' -v
